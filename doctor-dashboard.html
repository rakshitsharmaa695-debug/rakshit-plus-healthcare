<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RakshitPlus - Doctor Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Navigation -->
    <nav class="fixed w-full top-0 z-50 glass-nav border-b border-slate-100/50">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-3 md:py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center group">
                <img src="1000022082.png" alt="RakshitPlus Logo" class="h-10 md:h-12 object-contain group-hover:scale-105 transition-transform duration-300">
            </a>
            <div class="flex items-center gap-4">
                <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider hidden md:block">Doctor Portal Active</span>
                <button onclick="logout()" class="text-sm font-bold text-slate-500 hover:text-rose-500 transition border px-4 py-2 rounded-xl">Secure Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 md:px-8 pt-32 pb-20">
        <!-- Dashboard Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-2">My Workspace</h1>
                <p class="text-slate-500 font-medium">Manage your daily appointments and patient triage.</p>
            </div>
            <button onclick="loadAppointments()" class="bg-slate-900 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-purple-600 transition flex items-center gap-2">
                <span>🔄</span> Refresh Queue
            </button>
        </div>

        <!-- Analytics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-14 h-14 rounded-full bg-blue-100 flex items-center justify-center text-2xl">📅</div>
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wide">Total Appointments</p>
                    <p id="stat-total" class="text-3xl font-black text-slate-800">0</p>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-14 h-14 rounded-full bg-amber-100 flex items-center justify-center text-2xl">⏳</div>
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wide">Pending Queue</p>
                    <p id="stat-pending" class="text-3xl font-black text-slate-800">0</p>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-14 h-14 rounded-full bg-green-100 flex items-center justify-center text-2xl">✅</div>
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wide">Completed Today</p>
                    <p id="stat-completed" class="text-3xl font-black text-slate-800">0</p>
                </div>
            </div>
        </div>

        <!-- Appointment Data Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-100">
                <h2 class="text-lg font-bold text-slate-800">Patient Queue</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-500">
                    <thead class="text-xs text-slate-700 uppercase bg-slate-50">
                        <tr>
                            <th scope="col" class="px-6 py-4 rounded-tl-xl">ID</th>
                            <th scope="col" class="px-6 py-4">Patient Details</th>
                            <th scope="col" class="px-6 py-4">Date</th>
                            <th scope="col" class="px-6 py-4">Symptoms</th>
                            <th scope="col" class="px-6 py-4 rounded-tr-xl">Status</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentList" class="divide-y divide-slate-100">
                        <!-- Dynamic Rows will appear here -->
                    </tbody>
                </table>
                <div id="loadingState" class="p-10 text-center text-slate-500 font-medium">
                    Loading workspace data...
                </div>
            </div>
        </div>
    </main>

    <script>
        // Authentication Check
        const token = localStorage.getItem('rakshitplus_jwt');
        const role = localStorage.getItem('rakshitplus_role');

        if (!token || (role !== 'doctor' && role !== 'admin')) {
            alert("Security Alert: Unauthorized access. Please login as a Doctor.");
            window.location.href = 'index.html';
        }

        function logout() { 
            localStorage.removeItem('rakshitplus_jwt'); 
            localStorage.removeItem('rakshitplus_role'); 
            window.location.href = "index.html"; 
        }

        // Fetch Data from Server
        async function loadAppointments() {
            const listEl = document.getElementById('appointmentList');
            const loadingEl = document.getElementById('loadingState');
            
            listEl.innerHTML = '';
            loadingEl.style.display = 'block';
            loadingEl.innerText = "Fetching live data...";

            try {
                // Hitting the newly added doctor API route
                const response = await fetch('/api/doctor/appointments', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    throw new Error("Failed to authenticate session.");
                }

                const data = await response.json();
                loadingEl.style.display = 'none';

                if (data.length === 0) {
                    loadingEl.style.display = 'block';
                    loadingEl.innerText = "No appointments found.";
                    return;
                }

                // Update Stats Counters
                document.getElementById('stat-total').innerText = data.length;
                document.getElementById('stat-pending').innerText = data.filter(a => a.status === 'Pending').length;
                document.getElementById('stat-completed').innerText = data.filter(a => a.status === 'Completed').length;

                // Render Table Rows
                data.forEach(appt => {
                    let statusColor = appt.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700';
                    let statusDot = appt.status === 'Completed' ? 'bg-green-500' : 'bg-amber-500 animate-pulse';

                    let row = `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 font-bold text-slate-900">#${appt.id}</td>
                            <td class="px-6 py-4">
                                <div class="font-bold text-slate-800">${appt.patient_name}</div>
                                <div class="text-xs text-slate-400 mt-1">${appt.age} yrs • ${appt.gender} • ${appt.contact}</div>
                            </td>
                            <td class="px-6 py-4 font-medium text-slate-700">${appt.appointment_date}</td>
                            <td class="px-6 py-4 max-w-xs truncate" title="${appt.symptoms}">${appt.symptoms}</td>
                            <td class="px-6 py-4">
                                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${statusColor}">
                                    <span class="w-1.5 h-1.5 rounded-full ${statusDot}"></span>
                                    ${appt.status}
                                </span>
                            </td>
                        </tr>
                    `;
                    listEl.insertAdjacentHTML('beforeend', row);
                });

            } catch (error) {
                loadingEl.style.display = 'block';
                loadingEl.innerHTML = `<span class="text-red-500 font-bold">Session expired or error loading data. Please login again.</span>`;
            }
        }

        // Run on page load
        document.addEventListener('DOMContentLoaded', loadAppointments);
    </script>
</body>
</html>
