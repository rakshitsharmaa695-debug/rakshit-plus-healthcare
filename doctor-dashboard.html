<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RakshitPlus - Doctor Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Navigation -->
    <nav class="fixed w-full top-0 z-50 glass-nav border-b border-slate-100/50">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-3 md:py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center group">
                <img src="1000022082.png" alt="RakshitPlus Logo" class="h-10 md:h-12 object-contain group-hover:scale-105 transition-transform duration-300">
            </a>
            <div class="flex items-center gap-4">
                <span class="bg-purple-100 text-purple-700 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider hidden md:block border border-purple-200 shadow-sm">Doctor Portal Active</span>
                <button onclick="logout()" class="text-sm font-bold text-slate-500 hover:bg-rose-50 hover:text-rose-600 transition border border-slate-200 px-5 py-2 rounded-xl">Secure Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 md:px-8 pt-32 pb-20">
        <!-- Dashboard Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-2">My Workspace</h1>
                <p class="text-slate-500 font-medium text-lg">Manage your daily appointments and patient triage.</p>
            </div>
            <button onclick="loadAppointments()" class="bg-slate-900 text-white px-6 py-3 rounded-xl text-sm font-bold shadow-lg hover:bg-purple-600 transition flex items-center gap-2 transform active:scale-95">
                <span>🔄</span> Refresh Queue
            </button>
        </div>

        <!-- Analytics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-5 hover:shadow-md transition">
                <div class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center text-2xl border border-blue-100">📅</div>
                <div>
                    <p class="text-xs font-black text-slate-400 uppercase tracking-wide">Total Appointments</p>
                    <p id="stat-total" class="text-3xl font-black text-slate-800 mt-1">0</p>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-5 hover:shadow-md transition">
                <div class="w-14 h-14 rounded-full bg-amber-50 flex items-center justify-center text-2xl border border-amber-100 animate-pulse">⏳</div>
                <div>
                    <p class="text-xs font-black text-slate-400 uppercase tracking-wide">Waiting Patients</p>
                    <p id="stat-pending" class="text-3xl font-black text-slate-800 mt-1">0</p>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-5 hover:shadow-md transition">
                <div class="w-14 h-14 rounded-full bg-green-50 flex items-center justify-center text-2xl border border-green-100">✅</div>
                <div>
                    <p class="text-xs font-black text-slate-400 uppercase tracking-wide">Completed Today</p>
                    <p id="stat-completed" class="text-3xl font-black text-slate-800 mt-1">0</p>
                </div>
            </div>
        </div>

        <!-- Appointment Data Table -->
        <div class="bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <h2 class="text-lg font-black text-slate-800">Live Patient Queue</h2>
                <span class="flex items-center gap-2 text-xs font-bold text-slate-500"><span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span> Live Sync</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="text-xs text-slate-400 uppercase bg-white border-b border-slate-100 font-bold">
                        <tr>
                            <th scope="col" class="px-6 py-5">ID</th>
                            <th scope="col" class="px-6 py-5">Patient Details</th>
                            <th scope="col" class="px-6 py-5">Date</th>
                            <th scope="col" class="px-6 py-5">Symptoms</th>
                            <th scope="col" class="px-6 py-5">Status</th>
                            <th scope="col" class="px-6 py-5 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentList" class="divide-y divide-slate-50">
                        <!-- Dynamic Rows will appear here -->
                    </tbody>
                </table>
                <div id="loadingState" class="p-12 text-center text-slate-500 font-medium">
                    <div class="inline-block w-8 h-8 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin mb-3"></div>
                    <p>Loading live workspace data...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('rakshitplus_jwt');
        const role = localStorage.getItem('rakshitplus_role');

        if (!token || (role !== 'doctor' && role !== 'admin')) {
            alert("Security Alert: Unauthorized access. Please login as a Doctor.");
            window.location.href = 'index.html';
        }

        function logout() { 
            localStorage.removeItem('rakshitplus_jwt'); 
            localStorage.removeItem('rakshitplus_role'); 
            window.location.href = "index.html"; 
        }

        // Action: Mark Appointment as Completed
        async function updateStatus(appointmentId) {
            if(!confirm("Mark this patient visit as completed?")) return;
            
            try {
                const response = await fetch(`/api/doctor/appointment/${appointmentId}/status`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ status: 'Completed' })
                });

                if (response.ok) {
                    loadAppointments(); // Refresh the table
                } else {
                    alert("Failed to update status.");
                }
            } catch(e) {
                alert("Network error.");
            }
        }

        async function loadAppointments() {
            const listEl = document.getElementById('appointmentList');
            const loadingEl = document.getElementById('loadingState');
            
            listEl.innerHTML = '';
            loadingEl.style.display = 'block';

            try {
                const response = await fetch('/api/doctor/appointments', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Auth Failed");
                const data = await response.json();
                loadingEl.style.display = 'none';

                if (data.length === 0) {
                    loadingEl.style.display = 'block';
                    loadingEl.innerHTML = "<p class='font-bold text-slate-400 py-4'>No appointments in the queue.</p>";
                    return;
                }

                // Update Stats
                document.getElementById('stat-total').innerText = data.length;
                document.getElementById('stat-pending').innerText = data.filter(a => a.status === 'Pending').length;
                document.getElementById('stat-completed').innerText = data.filter(a => a.status === 'Completed').length;

                // Render Rows
                data.forEach(appt => {
                    let isCompleted = appt.status === 'Completed';
                    let statusColor = isCompleted ? 'bg-green-100 text-green-700 border-green-200' : 'bg-amber-100 text-amber-700 border-amber-200';
                    let statusDot = isCompleted ? 'bg-green-500' : 'bg-amber-500 animate-pulse';
                    
                    // The "Badiya UI" Action Button
                    let actionButton = isCompleted 
                        ? `<span class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-400 bg-slate-50 px-3 py-2 rounded-lg border border-slate-100">✔️ Done</span>`
                        : `<button onclick="updateStatus(${appt.id})" class="inline-flex items-center gap-2 bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-lg text-xs font-bold shadow-md hover:shadow-lg transition transform active:scale-95">🩺 Complete Visit</button>`;

                    let rowClass = isCompleted ? 'opacity-70 bg-slate-50/50' : 'hover:bg-blue-50/30 transition-colors bg-white';

                    let row = `
                        <tr class="${rowClass}">
                            <td class="px-6 py-5 font-black text-slate-900">#${appt.id}</td>
                            <td class="px-6 py-5">
                                <div class="font-black text-slate-800 text-base">${appt.patient_name}</div>
                                <div class="text-xs text-slate-500 mt-1 font-medium">${appt.age} yrs • ${appt.gender} • ${appt.contact}</div>
                            </td>
                            <td class="px-6 py-5 font-bold text-slate-600">${appt.appointment_date}</td>
                            <td class="px-6 py-5 max-w-[200px] truncate font-medium" title="${appt.symptoms}">${appt.symptoms}</td>
                            <td class="px-6 py-5">
                                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black border ${statusColor}">
                                    <span class="w-1.5 h-1.5 rounded-full ${statusDot}"></span>
                                    ${appt.status}
                                </span>
                            </td>
                            <td class="px-6 py-5 text-right">
                                ${actionButton}
                            </td>
                        </tr>
                    `;
                    listEl.insertAdjacentHTML('beforeend', row);
                });
            } catch (error) {
                loadingEl.style.display = 'block';
                loadingEl.innerHTML = `<span class="text-red-500 font-bold">Error loading data.</span>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadAppointments);
    </script>
</body>
</html>
