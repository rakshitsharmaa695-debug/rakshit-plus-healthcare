<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - RakshitPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="text-center">
        <h1 class="text-4xl font-black text-purple-600 mb-4">Doctor Dashboard</h1>
        <p class="text-slate-500 font-medium">Welcome! This is a separate space for doctors.</p>
        <button onclick="logout()" class="mt-8 bg-slate-900 text-white px-6 py-2 rounded-xl">Logout</button>
    </div>
    <script>
        function logout() { localStorage.removeItem('rakshitplus_jwt'); localStorage.removeItem('rakshitplus_role'); window.location.href = "index.html"; }
    </script>
</body>
</html>
