<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - SmartCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; } .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }</style>
</head>
<body class="text-slate-800 antialiased">

    <nav class="fixed w-full top-0 z-50 glass-nav border-b border-slate-100 shadow-sm px-4">
        <div class="max-w-7xl mx-auto py-3 md:py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center group">
                <img src="1000022082.png" alt="SmartCare Logo" class="h-10 md:h-12 object-contain group-hover:scale-105 transition-transform duration-300">
            </a>
            <div class="flex items-center gap-3">
                <a href="booking.html" class="hidden md:block bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-slate-900 transition">Book Consult</a>
                <button onclick="logout()" class="text-xs md:text-sm font-bold text-slate-500 hover:bg-rose-50 hover:text-rose-600 transition border px-3 py-1.5 md:px-4 md:py-2 rounded-lg">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 md:px-8 pt-28 pb-20">
        <div class="mb-6 md:mb-8 text-center sm:text-left">
            <h1 class="text-2xl md:text-4xl font-black text-slate-900 mb-2">My Health Dashboard</h1>
            <p class="text-sm md:text-base text-slate-500 font-medium">Track your appointments and live queue status.</p>
        </div>

        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-3xl p-6 md:p-8 text-white shadow-lg mb-8 flex flex-col sm:flex-row items-center sm:items-start text-center sm:text-left gap-4 sm:gap-6 relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-white opacity-10 blur-3xl rounded-full"></div>
            <div class="w-20 h-20 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center text-4xl shadow-inner border-2 border-white/20 shrink-0">👤</div>
            <div>
                <h2 class="text-2xl md:text-3xl font-black mb-1" id="profileName">Loading...</h2>
                <p class="text-blue-200 font-medium text-sm md:text-base mb-3" id="profileEmail">Fetching details</p>
                <span class="inline-block bg-white/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest border border-white/30">Registered Patient</span>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <h2 class="text-base md:text-lg font-bold text-slate-800">My Appointments</h2>
                <a href="booking.html" class="md:hidden bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm">➕ Book</a>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="text-xs text-slate-400 uppercase bg-white border-b border-slate-100 font-bold whitespace-nowrap">
                        <tr><th class="px-6 py-4">ID</th><th class="px-6 py-4">Doctor & Dept</th><th class="px-6 py-4">Date</th><th class="px-6 py-4">Status</th><th class="px-6 py-4 text-center">Live Queue</th></tr>
                    </thead>
                    <tbody id="myApptList" class="divide-y divide-slate-50">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400">Loading appointments...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('smartcare_jwt'); const role = localStorage.getItem('smartcare_role');
        if (!token || role !== 'patient') { window.location.href = 'index.html'; }
        function logout() { localStorage.removeItem('smartcare_jwt'); localStorage.removeItem('smartcare_role'); window.location.href = 'index.html'; }

        async function loadMyDashboard() {
            try {
                const profileRes = await fetch('/api/user/profile', { headers: { 'Authorization': `Bearer ${token}` } });
                if (profileRes.ok) { const profile = await profileRes.json(); document.getElementById('profileName').innerText = profile.name; document.getElementById('profileEmail').innerText = profile.email; }
            } catch(e) {}
            try {
                const res = await fetch('/api/appointments/me', { headers: { 'Authorization': `Bearer ${token}` } }); const data = await res.json();
                const list = document.getElementById('myApptList'); list.innerHTML = '';
                if(data.length === 0) { list.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center font-bold text-slate-400">No appointments found.</td></tr>`; return; }
                data.forEach(appt => {
                    let stColor = appt.status === 'Completed' ? 'text-green-600 bg-green-100' : 'text-amber-600 bg-amber-100';
                    let queueBtn = appt.status === 'Pending' ? `<button onclick="checkQueue(${appt.id})" class="text-[10px] md:text-xs font-bold bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow-sm hover:bg-slate-900 transition whitespace-nowrap">⏳ Track Time</button>` : `<span class="text-xs font-bold text-slate-300">Closed</span>`;
                    list.innerHTML += `<tr class="hover:bg-slate-50/50 transition"><td class="px-6 py-4 font-black text-slate-900">#${appt.id}</td><td class="px-6 py-4 whitespace-nowrap"><p class="font-bold text-slate-800">${appt.doctor_name || 'AI Assigned'}</p><p class="text-xs font-medium text-slate-500">${appt.department}</p></td><td class="px-6 py-4 font-bold text-slate-600 whitespace-nowrap">${appt.appointment_date}</td><td class="px-6 py-4"><span class="px-3 py-1 rounded-full text-[10px] md:text-xs font-black tracking-wide ${stColor}">${appt.status}</span></td><td class="px-6 py-4 text-center">${queueBtn}</td></tr>`;
                });
            } catch(e) {}
        }
        async function checkQueue(id) { try { const res = await fetch(`/api/queue/${id}`); const data = await res.json(); alert(`LIVE QUEUE STATUS:\nThere are ${data.patientsAhead} patient(s) ahead of you.\nEstimated wait time: ${data.estimatedWaitTime} mins.`); } catch(e) { alert("Failed to fetch queue status."); } }
        document.addEventListener('DOMContentLoaded', loadMyDashboard);
    </script>
</body>
</html>
