<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - RakshitPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Navigation -->
    <nav class="fixed w-full top-0 z-50 glass-nav border-b border-slate-100/50">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-3 md:py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center group">
                <img src="1000022082.png" alt="RakshitPlus Logo" class="h-10 md:h-12 object-contain group-hover:scale-105 transition-transform duration-300">
            </a>
            <div class="flex items-center gap-4">
                <a href="booking.html" class="hidden md:block bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-slate-900 transition">Book New Consult</a>
                <button onclick="logout()" class="text-sm font-bold text-slate-500 hover:text-rose-500 transition border px-4 py-2 rounded-xl">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 md:px-8 pt-32 pb-20">
        <div class="mb-8">
            <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-2">My Health Dashboard</h1>
            <p class="text-slate-500 font-medium">Track your appointments and live queue status.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-200">
                <h2 class="text-lg font-bold text-slate-800">My Medical Appointments</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-500">
                    <thead class="text-xs text-slate-700 uppercase bg-slate-50">
                        <tr>
                            <th class="px-6 py-4">Appointment ID</th>
                            <th class="px-6 py-4">Doctor & Dept</th>
                            <th class="px-6 py-4">Date</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Live Queue</th>
                        </tr>
                    </thead>
                    <tbody id="myApptList" class="divide-y divide-slate-100">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('rakshitplus_jwt');
        const role = localStorage.getItem('rakshitplus_role');

        if (!token || role !== 'patient') {
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('rakshitplus_jwt');
            localStorage.removeItem('rakshitplus_role');
            window.location.href = 'index.html';
        }

        async function loadMyDashboard() {
            try {
                const res = await fetch('/api/appointments/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const list = document.getElementById('myApptList');
                list.innerHTML = '';
                
                if(data.length === 0) {
                    list.innerHTML = `<tr><td colspan="5" class="px-6 py-10 text-center font-bold text-slate-400">No appointments found.</td></tr>`;
                    return;
                }
                
                data.forEach(appt => {
                    let stColor = appt.status === 'Completed' ? 'text-green-600 bg-green-100' : 'text-amber-600 bg-amber-100';
                    let queueBtn = appt.status === 'Pending' 
                        ? `<button onclick="checkQueue(${appt.id})" class="text-xs font-bold bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-slate-900 transition">Check Wait Time</button>` 
                        : `<span class="text-xs font-bold text-slate-400">Done</span>`;
                    
                    list.innerHTML += `
                        <tr class="hover:bg-slate-50">
                            <td class="px-6 py-4 font-bold text-slate-900">#${appt.id}</td>
                            <td class="px-6 py-4">
                                <p class="font-bold text-slate-800">${appt.doctor_name || 'AI Routing...'}</p>
                                <p class="text-xs text-slate-500">${appt.department}</p>
                            </td>
                            <td class="px-6 py-4 font-medium">${appt.appointment_date}</td>
                            <td class="px-6 py-4"><span class="px-2 py-1 rounded-md text-xs font-bold ${stColor}">${appt.status}</span></td>
                            <td class="px-6 py-4">${queueBtn}</td>
                        </tr>
                    `;
                });
            } catch(e) { console.error("Error loading patient data."); }
        }

        async function checkQueue(id) {
            try {
                const res = await fetch(`/api/queue/${id}`);
                const data = await res.json();
                alert(`LIVE QUEUE STATUS:\nThere are ${data.patientsAhead} patient(s) ahead of you.\nEstimated wait time: ${data.estimatedWaitTime} mins.`);
            } catch(e) { alert("Failed to fetch queue status."); }
        }

        document.addEventListener('DOMContentLoaded', loadMyDashboard);
    </script>
</body>
</html>
