<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare - Smart Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; } .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); } @keyframes popIn { 0% { opacity: 0; transform: scale(0.95) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } } .chat-bubble { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; } .chat-scroll::-webkit-scrollbar { width: 6px; } .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }</style>
</head>
<body class="text-slate-800 antialiased">

    <!-- 🌟 NAVBAR -->
    <nav class="fixed w-full top-0 z-50 glass-nav border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-3 md:py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group z-50">
                <div class="bg-blue-600 text-white w-9 h-9 md:w-11 md:h-11 flex items-center justify-center rounded-xl font-black text-lg md:text-xl shadow-lg group-hover:bg-slate-900 transition">SC</div>
                <span class="font-black text-xl md:text-2xl tracking-tight text-slate-900 group-hover:text-blue-600 transition">Smart<span class="text-blue-600 group-hover:text-slate-900">Care</span></span>
            </a>
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="text-xs md:text-sm font-bold text-slate-500 hover:text-blue-600 transition">My Dashboard</a>
                <button onclick="logout()" class="text-xs md:text-sm font-bold text-rose-500 border border-rose-200 px-3 md:px-4 py-1.5 md:py-2 rounded-xl hover:bg-rose-50 transition">Logout</button>
            </div>
        </div>
    </nav>

    <!-- 🌟 MOBILE OVERLAP FIX: Added pt-28 -->
    <div class="max-w-7xl mx-auto px-4 md:px-8 pt-28 md:pt-32 pb-10 flex flex-col lg:flex-row gap-6 lg:gap-12">
        <div class="lg:w-2/3 bg-white rounded-[1.5rem] md:rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden flex flex-col h-[450px] md:h-[650px]">
            <div class="bg-slate-50 border-b border-slate-200 p-3 md:p-5 flex items-center justify-between z-10 shadow-sm shrink-0">
                <div class="flex items-center gap-3 md:gap-4"><div class="w-10 h-10 md:w-12 md:h-12 bg-white text-blue-600 rounded-full flex items-center justify-center text-2xl shadow-md border border-slate-100 shrink-0 p-1">🤖</div><div class="flex flex-col"><h2 class="font-black text-slate-900 text-sm md:text-lg leading-tight">Virtual Booking Assistant</h2><span class="text-[10px] md:text-[11px] text-blue-500 font-bold mb-0.5 tracking-wide">Powered By SmartCare</span><p class="text-[10px] md:text-xs font-bold text-green-500 flex items-center gap-1 mt-0.5"><span class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-green-500 animate-pulse"></span> Online</p></div></div>
                <div id="doctorBadge" class="hidden bg-purple-50 text-purple-700 px-2 md:px-3 py-1 md:py-1.5 rounded-lg text-[10px] md:text-xs font-bold border border-purple-200 shrink-0 text-center uppercase tracking-wide">Direct<br class="md:hidden"> Booking</div>
            </div>
            <div id="chatBox" class="flex-1 p-4 md:p-6 overflow-y-auto chat-scroll bg-slate-50 space-y-4 md:space-y-5"></div>
            <div id="inputBox" class="bg-white border-t border-slate-200 p-3 md:p-5 shrink-0"></div>
        </div>
        
        <div class="lg:w-1/3 bg-slate-900 rounded-[1.5rem] md:rounded-[2rem] p-6 md:p-10 text-center shadow-2xl relative overflow-hidden flex flex-col justify-center min-h-[350px] md:min-h-[400px]">
            <div class="absolute inset-0 bg-blue-500 opacity-20 blur-3xl rounded-full"></div>
            <div id="qrPlaceholder" class="relative z-10 w-full py-6 md:py-10"><div class="w-16 h-16 md:w-20 md:h-20 bg-slate-800 text-slate-400 border border-slate-700 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl md:text-4xl shadow-inner">🎫</div><h3 class="font-black text-white text-lg md:text-2xl mb-2">Digital Ticket</h3><p class="text-slate-400 text-xs md:text-sm font-medium">Answer questions to generate pass.</p></div>
            <div id="successResult" class="hidden relative z-10 w-full flex flex-col items-center text-white"><div class="bg-green-500/20 text-green-400 px-3 py-1.5 rounded-full text-xs md:text-sm font-bold mb-4 flex items-center gap-2 border border-green-500/50"><span>✓</span> Booking Confirmed</div><div class="bg-white p-3 md:p-4 rounded-[1.5rem] shadow-xl mb-4"><div id="qrcode"></div></div><h4 class="text-lg md:text-xl font-black text-blue-300" id="res-dept">Department</h4><div id="res-id" class="w-full"></div></div>
        </div>
    </div>

    <script>
        // 🌟 SAAS AUTO-REDIRECT LOGIC ADDED HERE
        const token = localStorage.getItem('smartcare_jwt'); 
        const role = localStorage.getItem('smartcare_role');
        
        if (!token) { 
            alert("Please login to book an appointment."); 
            window.location.href = 'index.html'; 
        }
        
        // If Doctor or Admin tries to book an appointment, kick them to their dashboard!
        if (role === 'admin') { window.location.href = 'admin.html'; }
        if (role === 'doctor') { window.location.href = 'doctor-dashboard.html'; }

        function logout() { localStorage.clear(); window.location.href="index.html"; }
        
        const urlParams = new URLSearchParams(window.location.search); const preSelectedDocId = urlParams.get('docId');
        const chatBox = document.getElementById('chatBox'); const inputBox = document.getElementById('inputBox');
        let currentStep = 0; const bookingData = { doctor_id: preSelectedDocId || null };
        const questions = [{ key: 'patient_name', type: 'text', q: "What is the patient's full name?", placeholder: "Rahul Sharma" }, { key: 'contact', type: 'tel', q: "Please provide a valid contact number.", placeholder: "9876543210" }, { key: 'age', type: 'number', q: "How old is the patient?", placeholder: "Age" }, { key: 'gender', type: 'options', q: "What is the patient's gender?", opts: ['Male', 'Female', 'Other'] }, { key: 'symptoms', type: 'text', q: "Briefly describe the symptoms.", placeholder: "Severe headache..." }, { key: 'date', type: 'date', q: "When would you like to visit?" }, { key: 'time', type: 'options', q: "Select a preferred time slot.", opts: ['10:00 AM', '11:30 AM', '01:00 PM', '02:30 PM'] }];

        function scrollToBottom() { setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 100); }
        function appendBotMessage(text) { chatBox.insertAdjacentHTML('beforeend', `<div class="flex gap-2.5 w-full chat-bubble"><div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white text-blue-600 flex items-center justify-center text-xl shadow-md shrink-0 border border-slate-200">🤖</div><div class="bg-white border border-slate-200 text-slate-800 p-3 rounded-2xl rounded-tl-none max-w-[85%] text-xs md:text-sm font-medium shadow-sm leading-relaxed">${text}</div></div>`); scrollToBottom(); }
        function appendUserMessage(text) { chatBox.insertAdjacentHTML('beforeend', `<div class="flex w-full justify-end chat-bubble"><div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[85%] text-xs md:text-sm font-bold shadow-md">${text}</div></div>`); scrollToBottom(); }

        function renderInput() {
            if (currentStep >= questions.length) { inputBox.innerHTML = ''; processBooking(); return; } const step = questions[currentStep]; inputBox.innerHTML = '';
            if (['text', 'tel', 'number', 'date'].includes(step.type)) { let minAttr = step.type === 'date' ? `min="${new Date().toISOString().split('T')[0]}"` : ''; inputBox.innerHTML = `<div class="flex gap-2"><input type="${step.type}" id="chat-input" placeholder="${step.placeholder || ''}" ${minAttr} class="flex-1 bg-slate-50 border border-slate-300 p-3 md:p-3.5 rounded-xl outline-none focus:border-blue-600 font-bold text-sm shadow-inner"><button onclick="submitAnswer()" class="bg-blue-600 text-white px-5 rounded-xl font-black shadow-lg hover:bg-slate-900 transition">➤</button></div>`; const inputEl = document.getElementById('chat-input'); inputEl.focus(); inputEl.addEventListener('keypress', (e) => { if(e.key === 'Enter') submitAnswer(); }); } 
            else if (step.type === 'options') { let btns = step.opts.map(opt => `<button onclick="submitAnswer('${opt}')" class="bg-white border-2 border-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold hover:border-blue-600 hover:text-blue-600 transition shadow-sm">${opt}</button>`).join(''); inputBox.innerHTML = `<div class="flex flex-wrap gap-2 w-full justify-center md:justify-start">${btns}</div>`; }
        }

        function submitAnswer(predefinedValue = null) { 
            let value = predefinedValue || document.getElementById('chat-input')?.value.trim(); 
            if (!value) return; 
            const step = questions[currentStep];
            if (step.key === 'patient_name' && value.length < 3) return alert("⚠️ Please enter a valid name (at least 3 characters).");
            if (step.key === 'contact' && !/^[0-9]{10}$/.test(value)) return alert("⚠️ Please enter a valid 10-digit mobile number.");
            if (step.key === 'age' && (isNaN(value) || value <= 0 || value > 120)) return alert("⚠️ Please enter a valid age (1-120).");
            if (step.key === 'symptoms' && value.length < 4) return alert("⚠️ Please describe symptoms in a bit more detail.");
            if (step.key === 'date') { const selected = new Date(value); const today = new Date(); today.setHours(0,0,0,0); if(selected < today) return alert("⚠️ Please select today or a future date."); }
            bookingData[step.key] = value; appendUserMessage(value); currentStep++; 
            setTimeout(() => { if(currentStep < questions.length) { appendBotMessage(questions[currentStep].q); renderInput(); } else { renderInput(); } }, 400); 
        }

        async function startChat() { if(preSelectedDocId) { document.getElementById('doctorBadge').classList.remove('hidden'); try { const doc = await (await fetch(`/api/doctors/${preSelectedDocId}`)).json(); appendBotMessage(`Hello! I see you want to book an appointment with <b>${doc.name}</b>. Let's get the patient's details.`); } catch(e) { appendBotMessage(`Hello! Let's get your appointment booked.`); } } else { appendBotMessage(`Hello! Let's get your appointment booked. SmartCare AI will assign the best specialist.`); } setTimeout(() => { appendBotMessage(questions[0].q); renderInput(); }, 600); }

        async function processBooking() {
            appendBotMessage("<span class='animate-pulse text-blue-600 font-bold'>Processing and generating Pass... ⏳</span>");
            const payload = { ...bookingData, date: `${bookingData.date} | ${bookingData.time}` }; delete payload.time;
            try { const res = await fetch('/api/appointments', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(payload) }); const data = await res.json(); if (res.status === 201) { appendBotMessage(`🎉 <b>Booking Complete!</b><br>Check the <b>Digital Ticket</b> generated below/aside.`); document.getElementById('qrPlaceholder').classList.add('hidden'); document.getElementById('successResult').classList.remove('hidden'); const trackingUrl = `${window.location.origin}/tracking.html?id=${data.id}`; document.getElementById('qrcode').innerHTML = ""; new QRCode(document.getElementById("qrcode"), { text: trackingUrl, width: window.innerWidth < 768 ? 120 : 150, height: window.innerWidth < 768 ? 120 : 150, colorDark : "#0f172a", colorLight : "#ffffff" }); document.getElementById('res-dept').innerText = data.dept; document.getElementById('res-id').innerHTML = `<a href="${trackingUrl}" target="_blank" class="mt-4 block w-full bg-white text-slate-900 py-3 rounded-xl text-xs md:text-sm font-black hover:bg-blue-50 transition shadow-lg">Open Live Tracker ➤</a>`; } else { appendBotMessage(`⚠️ Error: ${data.error}`); } } catch(err) { appendBotMessage(`⚠️ Network error.`); }
        }
        document.addEventListener('DOMContentLoaded', startChat);
    </script>
</body>
</html>
