<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RakshitPlus - Find Top Specialists</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-bg { background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%); }
        /* VS Code Warning Fixed Here */
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-8 py-4 max-w-7xl mx-auto bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-100">
        <a href="index.html" class="flex items-center">
            <img src="1000022082.png" alt="RakshitPlus Logo" class="h-14 object-contain">
        </a>
        <div class="hidden md:flex space-x-8 font-medium text-slate-600">
            <a href="index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="doctors.html" class="text-blue-600 font-bold">Find Doctors</a>
            <a href="ai-checkup.html" class="hover:text-blue-600 transition">AI Checkup</a>
        </div>
        <a href="index.html#booking-section" class="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold shadow-md hover:bg-blue-600 transition">Book Now</a>
    </nav>

    <!-- Header & Search Section -->
    <div class="hero-bg border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-8 py-16 text-center">
            <span class="bg-blue-100 text-blue-700 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wide border border-blue-200">Expert Panel</span>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mt-4 mb-4">Find & Book Top Doctors</h1>
            <p class="text-lg text-slate-600 max-w-2xl mx-auto mb-10 font-medium">Verified specialists from top medical institutions. Get expert healthcare tailored to your symptoms.</p>
            
            <!-- Search Bar -->
            <div class="max-w-2xl mx-auto relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <span class="text-2xl">🔍</span>
                </div>
                <input type="text" id="searchInput" onkeyup="filterDoctors()" class="w-full bg-white border-2 border-slate-200 p-5 pl-14 rounded-2xl outline-none focus:border-blue-500 focus:shadow-xl transition-all text-slate-800 font-medium text-lg" placeholder="Search by doctor name or specialty (e.g. Cardiology)...">
            </div>
        </div>
    </div>

    <!-- Doctors Grid Section -->
    <div class="max-w-7xl mx-auto px-8 py-16">
        <div class="flex justify-between items-end mb-8">
            <h2 class="text-2xl font-extrabold text-slate-900">Available Specialists</h2>
            <p class="text-sm font-bold text-slate-500" id="docCount">Loading...</p>
        </div>

        <div id="doctorsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-20 text-slate-400 font-medium animate-pulse text-lg">Fetching verified doctors from database...</div>
        </div>
    </div>

    <script>
        let allDoctors = [];

        async function fetchDoctors() {
            try {
                const res = await fetch('/api/doctors');
                allDoctors = await res.json();
                renderDoctors(allDoctors);
            } catch (err) {
                document.getElementById('doctorsGrid').innerHTML = `<div class="col-span-full text-center py-20 text-red-500 font-bold">Failed to load doctors. Is backend running?</div>`;
            }
        }

        function filterDoctors() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allDoctors.filter(doc => 
                doc.name.toLowerCase().includes(query) || 
                doc.specialization.toLowerCase().includes(query)
            );
            renderDoctors(filtered);
        }

        function renderDoctors(docs) {
            const grid = document.getElementById('doctorsGrid');
            document.getElementById('docCount').innerText = `${docs.length} Doctors Found`;

            if (docs.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white rounded-3xl border border-slate-200 p-16 text-center shadow-sm">
                        <div class="text-5xl mb-4">🩺</div>
                        <h3 class="text-xl font-extrabold text-slate-900 mb-2">No Doctors Found</h3>
                        <p class="text-slate-500">We couldn't find any specialist matching your search.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = docs.map(doc => `
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 relative group flex flex-col h-full">
                    
                    <div class="flex items-start gap-4 mb-5">
                        <div class="relative shrink-0">
                            <img src="${doc.image_url}" class="w-20 h-20 rounded-full object-cover shadow-md border border-slate-100 group-hover:border-blue-500 transition">
                            <span class="absolute bottom-0 right-0 w-4 h-4 bg-green-500 border-2 border-white rounded-full"></span>
                        </div>
                        <div>
                            <h3 class="text-xl font-extrabold text-slate-900 flex items-center gap-1.5 leading-tight mb-1">
                                ${doc.name}
                                <svg class="w-5 h-5 text-blue-500" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L5.6 12.2l1.4-1.4 3.1 3.1 6.9-6.9 1.4 1.4-8.3 8.3z"/>
                                </svg>
                            </h3>
                            <span class="inline-block bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md text-xs font-bold border border-blue-100">${doc.specialization}</span>
                            <p class="text-xs font-bold text-slate-500 mt-2 line-clamp-1" title="${doc.qualification || 'MBBS'}">🎓 ${doc.qualification || 'MBBS, MD'}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-5 bg-slate-50 rounded-2xl p-4 border border-slate-100">
                        <div>
                            <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wide">Experience</p>
                            <p class="font-extrabold text-slate-800 text-sm">⭐ ${doc.experience || '5+ Years'}</p>
                        </div>
                        <div class="border-l border-slate-200 pl-3">
                            <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wide">Consultation Fee</p>
                            <p class="font-extrabold text-green-600 text-sm">₹${doc.fees || '500'}</p>
                        </div>
                    </div>

                    <div class="mb-6 flex-1">
                        <p class="text-xs font-extrabold text-slate-400 uppercase tracking-wide mb-1">About</p>
                        <p class="text-sm text-slate-600 font-medium line-clamp-2 leading-relaxed" title="${doc.about || 'Specialized in providing comprehensive healthcare and advanced medical treatments.'}">
                            "${doc.about || 'Specialized in providing comprehensive healthcare and advanced medical treatments.'}"
                        </p>
                    </div>

                    <div class="mt-auto pt-4 border-t border-slate-100 flex gap-3">
                        <a href="doctor-profile.html?id=${doc.id}" class="flex-1 flex justify-center items-center bg-white border-2 border-slate-200 text-slate-700 py-3 rounded-xl text-sm font-bold hover:border-blue-600 hover:text-blue-600 transition">
                            👀 View Profile
                        </a>
                        <a href="index.html?docId=${doc.id}#booking-section" class="flex-1 flex justify-center items-center bg-slate-900 text-white py-3 rounded-xl text-sm font-bold shadow-md hover:bg-blue-600 transition">
                            📅 Book Now
                        </a>
                    </div>
                </div>
            `).join('');
        }

        fetchDoctors();
    </script>
</body>
</html>
